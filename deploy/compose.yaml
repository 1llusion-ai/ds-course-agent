name: ds-course-agent
services:
  backend:
    image: ds-course-agent-backend:latest
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    # Load model/embedding/RAG config from the repo-root .env at runtime.
    # The image itself does not bake .env; values here are injected into the
    # container. Secrets in the `environment:` block below override any
    # same-named key from this file.
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../var:/app/var
      - ../data:/app/data
      # Optional: required only when PYTHON_EXEC_BACKEND=docker and the API
      # container should launch sibling sandbox containers. See docs/python_sandbox.md.
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1
      # Default compose deployment is fail-closed: code execution is disabled
      # unless an operator explicitly enables the Docker sandbox and mounts a
      # Docker daemon socket above.
      - PYTHON_EXEC_ENABLED=false
      - PYTHON_EXEC_BACKEND=docker
      # Deployment secrets/config are injected at runtime; the API image does
      # not copy .env. Set these in your shell, CI/CD secret store, or a Compose
      # env file before starting production.
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_DB_PATH=/app/var/auth.db
    networks:
      - rag-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); raise SystemExit(0 if response.status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  frontend:
    image: ds-course-agent-frontend:latest
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
